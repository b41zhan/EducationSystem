<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Назначения учителей - Education System</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #7c3aed;
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 20px;
    }

    .card h2, .card h3 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .field select, .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font: inherit;
      box-sizing: border-box;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 600;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: #6b7280;
      font-size: 13px;
      margin-top: 8px;
    }

    .empty {
      padding: 18px;
      text-align: center;
      color: #6b7280;
      border: 1px dashed #d1d5db;
      border-radius: 14px;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <h1 style="margin:0;">👩‍🏫 Назначения teacher ↔ class ↔ subject</h1>
      <div style="color:#6b7280;margin-top:8px;">
        Stage 5: реальная модель прав учителя по классам и предметам
      </div>
    </div>

    <div class="actions">
      <a href="/admin-dashboard.html" class="btn btn-secondary">← Назад в админку</a>
      <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div id="pageMessage" class="message"></div>

  <div class="layout">
    <div class="card">
      <h2>Создать назначение</h2>

      <div class="field">
        <label for="schoolSelect">Школа</label>
        <select id="schoolSelect"></select>
      </div>

      <div class="field">
        <label for="teacherSelect">Учитель</label>
        <select id="teacherSelect">
          <option value="">Сначала выбери школу</option>
        </select>
      </div>

      <div class="field">
        <label for="classSelect">Класс</label>
        <select id="classSelect">
          <option value="">Сначала выбери школу</option>
        </select>
      </div>

      <div class="field">
        <label for="subjectSelect">Предмет</label>
        <select id="subjectSelect">
          <option value="">Загрузка...</option>
        </select>
      </div>

      <button class="btn btn-primary" id="createBtn">Создать назначение</button>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
        <h2 style="margin:0;">Текущие назначения</h2>
        <button class="btn btn-secondary" id="refreshBtn">Обновить</button>
      </div>

      <div id="assignmentsList" class="list">
        <div class="empty">Выберите школу</div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-teaching-assignments.js"></script>
</body>
</html>
